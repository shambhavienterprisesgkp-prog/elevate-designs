<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ridgeline Contracting — Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --page:#9C9C9C;          /* warm grey page background */
  --cream:#EEEBE4;         /* left panel */
  --card:#FFFFFF;          /* floating headline card */
  --ink:#1E1E1C;
  --muted:#8A8A84;
  --line:#D8D4CC;
  --amber:#E0A23C;
}
html,body{height:100%}
body{
  font-family:'Inter',sans-serif;
  background:var(--page);
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:40px 20px;
  -webkit-font-smoothing:antialiased;
}

/* the whole hero floats as a card on the grey page */
.frame{
  position:relative;
  width:100%;max-width:1080px;
  aspect-ratio:16/10.2;
  background:var(--cream);
  display:grid;
  grid-template-columns:0.92fr 1.55fr;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.55);
  overflow:hidden;
}

/* ── LEFT PANEL ──────────────────────────────── */
.left{
  position:relative;
  padding:40px 38px;
  display:flex;flex-direction:column;
}
.logo{
  font-family:'Inter',sans-serif;
  font-weight:700;font-size:23px;letter-spacing:-.02em;
  color:var(--ink);display:flex;align-items:center;gap:7px;
}
.logo .dot{color:var(--amber)}
.logo .diamond{
  width:16px;height:16px;border:1.5px solid var(--ink);
  transform:rotate(45deg);position:relative;
}
.logo .diamond::after{
  content:'';position:absolute;inset:3px;background:var(--amber);
}

/* floating headline card */
.headline-card{
  position:absolute;
  top:40%;left:38px;
  transform:translateY(-50%);
  background:var(--card);
  padding:26px 30px;
  box-shadow:0 24px 50px -18px rgba(0,0,0,.35);
  z-index:5;
  /* overlaps into the photo area */
  width:128%;
  max-width:none;
}
.headline-card h1{
  font-family:'Cormorant Garamond',serif;
  font-weight:600;
  font-size:clamp(34px,4.6vw,54px);
  line-height:.98;
  letter-spacing:-.01em;
  color:var(--ink);
}
.headline-card h1 em{font-style:italic;color:var(--amber)}

.left-sub{
  margin-top:auto;
  font-size:11.5px;line-height:1.6;color:var(--muted);
  max-width:30ch;margin-bottom:22px;
  position:relative;z-index:2;
}
.see-more{
  display:inline-flex;align-items:center;gap:30px;
  background:var(--card);
  border:1px solid var(--line);
  padding:13px 18px;
  font-size:12px;font-weight:500;color:var(--ink);
  width:max-content;position:relative;z-index:2;
  transition:gap .25s, box-shadow .25s;cursor:pointer;
}
.see-more:hover{gap:38px;box-shadow:0 12px 24px -10px rgba(0,0,0,.25)}
.see-more .arr{font-size:14px;color:var(--ink)}

/* vertical side tab */
.side-tab{
  position:absolute;
  left:-1px;top:54%;
  transform:translateY(-50%);
  background:var(--card);
  border:1px solid var(--line);
  border-left:none;
  padding:14px 7px;
  writing-mode:vertical-rl;
  font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);
  display:flex;align-items:center;gap:7px;
  z-index:6;
}
.side-tab .star{transform:rotate(90deg);color:var(--amber);font-size:10px}

/* + button bottom-left */
.plus-btn{
  position:absolute;left:34px;bottom:30px;
  width:34px;height:34px;border-radius:50%;
  border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;
  font-size:16px;color:var(--muted);font-weight:300;
  z-index:6;cursor:pointer;transition:.2s;
}
.plus-btn:hover{color:var(--ink);border-color:var(--ink)}

/* ── RIGHT: THREE PANELS ─────────────────────── */
.right{
  position:relative;
  display:grid;
  grid-template-columns:repeat(3,1fr);
}

/* top nav over the panels */
.nav{
  position:absolute;top:34px;right:30px;
  display:flex;align-items:center;gap:30px;
  z-index:7;
}
.nav a{
  font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:rgba(255,255,255,.92);text-decoration:none;font-weight:500;
  transition:color .2s;
}
.nav a:hover{color:var(--amber)}
.nav .burger{display:flex;flex-direction:column;gap:4px;cursor:pointer}
.nav .burger span{width:20px;height:1.5px;background:#fff;display:block}

.panel{
  position:relative;overflow:hidden;
}
.panel img{
  position:absolute;inset:0;
  width:100%;height:100%;object-fit:cover;
  transition:transform .8s cubic-bezier(.25,.46,.45,.94);
}
.panel:hover img{transform:scale(1.06)}
.panel::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to top,rgba(20,20,18,.82) 0%,rgba(20,20,18,.15) 45%,transparent 70%);
}

/* caption */
.cap{
  position:absolute;left:24px;bottom:30px;right:18px;z-index:3;
}
.cap .num{
  font-size:11px;color:rgba(255,255,255,.85);
  letter-spacing:.05em;margin-bottom:14px;
  font-family:'Inter';font-weight:400;
}
.cap .line{
  width:1px;height:30px;background:rgba(255,255,255,.5);
  margin-bottom:14px;
}
.cap h3{
  font-family:'Cormorant Garamond',serif;
  font-weight:500;font-size:clamp(20px,2.4vw,27px);
  line-height:1.05;color:#fff;letter-spacing:0;
}

/* expand icon outside frame, bottom-right */
.expand{
  position:absolute;
  right:-26px;bottom:-26px;
  width:74px;height:74px;border-radius:50%;
  background:#8E8E8E;
  display:grid;place-items:center;
  box-shadow:0 16px 36px -12px rgba(0,0,0,.5);
  font-size:22px;color:#2A2A28;cursor:pointer;
  z-index:10;
}

/* ── RESPONSIVE ──────────────────────────────── */
@media(max-width:820px){
  .frame{
    grid-template-columns:1fr;
    aspect-ratio:auto;
    max-width:440px;
  }
  .left{padding:32px 28px 90px;min-height:340px}
  .headline-card{
    position:relative;top:auto;left:auto;transform:none;
    width:100%;margin:38px 0 0;
  }
  .left-sub{margin-top:26px}
  .side-tab{display:none}
  .plus-btn{display:none}
  .right{grid-template-columns:1fr;height:auto}
  .panel{height:200px}
  .nav{position:static;justify-content:flex-end;padding:0;
    background:var(--ink);width:100%;}
  .nav{display:none}
  .expand{display:none}
}
</style>
</head>
